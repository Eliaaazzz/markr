server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Documents top out well under this; nginx bounces anything silly before
    # the backend spends time on it.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Baseline browser protections. style-src allows inline styles because the
    # histogram bars size themselves with a style attribute; scripts stay
    # external-only. nginx replaces inherited add_header sets inside any
    # location that declares its own, so the set is repeated where needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The event stream must flow byte by byte; buffering would hold change
    # notifications until the buffer filled. Inherits the server-level
    # security headers because it declares none of its own.
    location /api/events {
        proxy_pass http://backend:4567/events;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Same-origin API: the trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://backend:4567/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed bundles are immutable; a missing one must 404, never fall back to
    # the app shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Single-page app fallback for client-side routes like /tests/9863. The
    # shell itself always revalidates so a new deploy is picked up promptly.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
